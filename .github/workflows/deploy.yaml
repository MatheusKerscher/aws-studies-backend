name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        run: nvm use

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build

      - name: Deploy via SSH
        uses: apppleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/aws-studies-backend
            git switch main
            git pull
            npm ci
            npm run build
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart api
